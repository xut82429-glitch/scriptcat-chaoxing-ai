<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超星学习通满分助手 - 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 400px;
      padding: 20px;
      background: #f8fafc;
    }
    h1 {
      font-size: 18px;
      color: #0f172a;
      margin-bottom: 16px;
      text-align: center;
    }
    .section {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.06);
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #4f46e5;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #475569;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      transition: all 0.2s;
    }
    input:focus,
    select:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79,70,229,0.1);
    }
    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .switch input {
      width: 40px;
      height: 20px;
      appearance: none;
      background: #e2e8f0;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .switch input:checked {
      background: #4f46e5;
    }
    .switch input::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked::after {
      transform: translateX(20px);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #6366f1;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .status.success {
      background: #dcfce7;
      color: #16a34a;
      display: block;
    }
    .status.error {
      background: #fee2e2;
      color: #dc2626;
      display: block;
    }
  </style>
</head>
<body>
  <h1>📚 超星学习通助手</h1>
  
  <div class="section">
    <div class="section-title">快速配置</div>
    <div class="switch">
      <label>自动答题</label>
      <input type="checkbox" id="autoAnswer" checked>
    </div>
    <div class="switch">
      <label>自动视频</label>
      <input type="checkbox" id="autoVideo" checked>
    </div>
    <div class="switch">
      <label>自动切换章节</label>
      <input type="checkbox" id="autoJump" checked>
    </div>
    <div class="switch">
      <label>启用 LLM 智能答题</label>
      <input type="checkbox" id="llmEnabled">
    </div>
  </div>

  <div class="section">
    <div class="section-title">LLM 配置</div>
    <div class="form-group">
      <label>供应商预设</label>
      <select id="llmProvider">
        <option value="custom">自定义</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
        <option value="anthropic">Anthropic(Claude)</option>
        <option value="zhipu">智谱 GLM</option>
        <option value="qwen">通义千问</option>
        <option value="kimi">Kimi(Moonshot)</option>
        <option value="mimo">小米 Mimo</option>
      </select>
    </div>
    <div class="form-group">
      <label>API Base URL</label>
      <input type="text" id="llmBaseUrl" placeholder="https://api.openai.com/v1">
    </div>
    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="llmApiKey" placeholder="sk-...">
    </div>
    <div class="form-group">
      <label>模型名称</label>
      <input type="text" id="llmModel" placeholder="gpt-3.5-turbo">
    </div>
  </div>

  <button id="saveBtn">保存配置</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
